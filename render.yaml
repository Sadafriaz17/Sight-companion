services:
  # ────────────────────────────────────────────────────────────────────────────
  # Service 1: Flask Backend (Docker Web Service)
  # Plan: standard (minimum) — Free tier has 512 MB RAM which is not enough
  # for PyTorch + YOLO + Depth-Anything models (~1.5-2 GB RAM required).
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: sight-companion-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    # Persistent disk caches HuggingFace + EasyOCR model weights between
    # deploys. Without this the ~800 MB models re-download on every restart.
    disk:
      name: ai-model-cache
      mountPath: /app/.cache
      sizeGB: 5
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: TRANSFORMERS_CACHE
        value: /app/.cache/hf
      - key: HF_HOME
        value: /app/.cache/hf
      - key: EASYOCR_MODULE_PATH
        value: /app/.cache/easyocr
      # ── Set these secrets in the Render dashboard (never commit real values) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Set FRONTEND_URL after the frontend service is deployed so CORS allows it
      - key: FRONTEND_URL
        sync: false

  # ────────────────────────────────────────────────────────────────────────────
  # Service 2: React Frontend (Static Site — free plan)
  # ────────────────────────────────────────────────────────────────────────────
  - type: static
    name: sight-companion-frontend
    buildCommand: cd Frontend && npm ci && npm run build
    staticPublishPath: ./Frontend/dist
    # SPA fallback: every route serves index.html so React Router works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to your backend URL once the backend service is deployed
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
