
services:
  # Flask AI Backend
  - type: web
    name: sight-companion-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /api/health

    # Persistent storage for downloaded AI models
    disk:
      name: ai-model-cache
      mountPath: /app/.cache
      sizeGB: 5

    envVars:
      - key: FLASK_DEBUG
        value: "0"

      - key: TRANSFORMERS_CACHE
        value: /app/.cache/hf

      - key: HF_HOME
        value: /app/.cache/hf

      - key: EASYOCR_MODULE_PATH
        value: /app/.cache/easyocr

      # Add these secret values in the Render dashboard
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false

  # React + Vite Frontend
  - type: web
    name: sight-companion-frontend
    runtime: static
    buildCommand: cd Frontend && npm ci && npm run build
    staticPublishPath: ./Frontend/dist

    # React Router fallback
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        sync: false

      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
